apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "maven-publish"

android {
    compileSdkVersion 36
    resourcePrefix = "ds_"

    defaultConfig {

        minSdkVersion 24
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            testCoverageEnabled true
        }
        debug {
            testCoverageEnabled true
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'net.kuama.documentscanner'
    publishing {
        singleVariant("release") {}
    }

}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.8.0"
    implementation "androidx.appcompat:appcompat:1.4.2"
    implementation "com.github.VERO-Digital-Solutions:android-native-opencv:bb69449a44"
    // ViewModel
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
    // LiveData
    api "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    // Lifecycles only (without ViewModel or LiveData)
    api "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"

    implementation "androidx.activity:activity-ktx:1.5.1"
    implementation "androidx.fragment:fragment-ktx:1.5.1"

    // CameraX core library using camera2 implementation
    implementation "androidx.camera:camera-camera2:1.4.2"
    // CameraX Lifecycle Library
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    // CameraX View class
    implementation "androidx.camera:camera-view:1.4.2"

    // zoomable image view
    implementation "com.github.chrisbanes:PhotoView:2.3.0"
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation "androidx.exifinterface:exifinterface:1.3.3"

    // for convenient logging
    implementation "com.jakewharton.timber:timber:5.0.1"

    // for preview stack
    implementation "com.github.yuyakaido:CardStackView:v2.3.4"

    // for image loading
    implementation("com.squareup.picasso:picasso:2.71828")
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.kotlin.srcDirs
    from android.sourceSets.main.java.srcDirs
    from fileTree(dir: 'src/libs', include: ['*.jar'])
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

// Because the components are created only during the afterEvaluate phase, you must
// configure your publications using the afterEvaluate() lifecycle method.
afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // Adds javadocs and sources as separate jars.
                // artifact androidJavadocsJar
                artifact androidSourcesJar

                groupId 'com.github.VERO-Digital-Solutions'
                artifactId 'android-document-scanner'
                version project.property('version_name')
            }
        }
    }
}
